<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">VPN configuration decryption pipeline</title>
  <desc id="desc">A dark futuristic animated terminal interface showing encrypted input flowing through validation and local decryption into structured output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset="0.52" stop-color="#0b1225"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7cffcb"/>
      <stop offset="1" stop-color="#5ee7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#6b7aa8" stroke-opacity=".09"/>
    </pattern>
    <clipPath id="screen"><rect x="54" y="94" width="1492" height="314" rx="16"/></clipPath>
  </defs>

  <rect width="1600" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="470" rx="28" fill="url(#grid)"/>
  <circle cx="1390" cy="-20" r="240" fill="#6f5cff" opacity=".12"/>
  <circle cx="120" cy="450" r="250" fill="#20d9dd" opacity=".08"/>

  <rect x="54" y="94" width="1492" height="314" rx="16" fill="#070b18" stroke="#324164" stroke-width="2"/>
  <path d="M54 136H1546" stroke="#324164" stroke-width="2"/>
  <circle cx="84" cy="115" r="7" fill="#ff5f57"/>
  <circle cx="108" cy="115" r="7" fill="#ffbd2e"/>
  <circle cx="132" cy="115" r="7" fill="#28c840"/>
  <text x="160" y="121" fill="#9aa9cc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">local-decryptor / secure-session</text>

  <g clip-path="url(#screen)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">
    <text x="92" y="182" fill="#7cffcb">$</text>
    <text x="120" y="182" fill="#d8e2ff">python OPENTUNNEL_TNL.py profile.tnl</text>
    <text x="92" y="222" fill="#5ee7ff">→</text>
    <text x="120" y="222" fill="#a9b7d8">validating OPL v2 container</text>
    <text x="650" y="222" fill="#7cffcb">[ok]</text>
    <text x="92" y="262" fill="#5ee7ff">→</text>
    <text x="120" y="262" fill="#a9b7d8">verifying CRC32 + AES-GCM tag</text>
    <text x="650" y="262" fill="#7cffcb">[ok]</text>
    <text x="92" y="302" fill="#5ee7ff">→</text>
    <text x="120" y="302" fill="#a9b7d8">parsing Java Properties XML</text>
    <text x="650" y="302" fill="#7cffcb">[ok]</text>
    <text x="92" y="358" fill="#7cffcb">✓</text>
    <text x="120" y="358" fill="#d8e2ff">decrypted locally → profile.decrypted.xml</text>
    <rect x="116" y="374" width="520" height="2" fill="url(#cyan)" opacity=".9">
      <animate attributeName="width" values="40;520;40" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M850 174h560M850 214h480M850 254h570M850 294h420M850 334h520" stroke="#233251" stroke-width="2"/>
    <path d="M850 174h330M850 214h290M850 254h370M850 294h245M850 334h310" stroke="url(#mint)" stroke-width="2" stroke-linecap="round" opacity=".8">
      <animate attributeName="stroke-dasharray" values="0 800;500 300;0 800" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <g fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".8" filter="url(#glow)">
      <circle cx="1368" cy="220" r="54" stroke-dasharray="8 12">
        <animateTransform attributeName="transform" type="rotate" from="0 1368 220" to="360 1368 220" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1368" cy="220" r="30" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="360 1368 220" to="0 1368 220" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M1368 150v140M1298 220h140" opacity=".35"/>
    </g>
    <circle cx="1368" cy="220" r="6" fill="#7cffcb" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="54" y="136" width="1492" height="4" fill="#5ee7ff" opacity=".12">
      <animate attributeName="y" values="140;400;140" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="80" y="58" fill="#d8e2ff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="3">LOCAL • AUDITABLE • AUTHENTICATED</text>
  <text x="1520" y="58" fill="#7cffcb" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">2036 // BUILD 01</text>
</svg>
