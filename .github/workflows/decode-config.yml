name: Decode configuration

on:
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - .github/workflows/decode-config.yml
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job identifier generated by the bot"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID that should receive the result"
        required: true
        type: string
      filename:
        description: "Original configuration filename, including its extension"
        required: true
        type: string
      file_data_b64:
        description: "Base64 file contents; use this for small files only"
        required: false
        type: string
      telegram_file_id:
        description: "Telegram file ID; the job downloads the file using its secret bot token"
        required: false
        type: string
      download_url:
        description: "Temporary HTTPS URL for larger files"
        required: false
        type: string
      download_sha256:
        description: "Optional SHA-256 of the file downloaded from download_url"
        required: false
        type: string
  repository_dispatch:
    types:
      - decode-config
      - bot-help

permissions:
  contents: read

concurrency:
  group: decoder-${{ github.event.inputs.job_id || github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id || github.run_id }}
  CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || '' }}
  FILENAME: ${{ github.event.inputs.filename || github.event.client_payload.filename || '' }}
  FILE_DATA_B64: ${{ github.event.inputs.file_data_b64 || github.event.client_payload.file_data_b64 || '' }}
  TELEGRAM_FILE_ID: ${{ github.event.inputs.telegram_file_id || github.event.client_payload.telegram_file_id || '' }}
  DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url || '' }}
  DOWNLOAD_SHA256: ${{ github.event.inputs.download_sha256 || github.event.client_payload.download_sha256 || '' }}
  REQUESTER_FIRST_NAME: ${{ github.event.inputs.first_name || github.event.client_payload.first_name || '' }}
  REQUESTER_LAST_NAME: ${{ github.event.inputs.last_name || github.event.client_payload.last_name || '' }}
  REQUESTER_USERNAME: ${{ github.event.inputs.username || github.event.client_payload.username || '' }}
  REQUESTER_USER_ID: ${{ github.event.inputs.user_id || github.event.client_payload.user_id || '' }}
  JOB_DIR: ${{ github.workspace }}/.decoder-config
  MAX_INPUT_BYTES: "8388608"

jobs:
  prepare-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out requirements
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore decoder environment
        id: decoder-venv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/decoder-venv
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-decoder-venv-${{ hashFiles('requirements.txt') }}

      - name: Install decoder dependencies
        if: steps.decoder-venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/decoder-venv"
          "$RUNNER_TEMP/decoder-venv/bin/python" -m pip install \
            --disable-pip-version-check -r requirements.txt

  decode:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'decode-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out decoder source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            *.py
            scripts
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore decoder environment
        id: decoder-venv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/decoder-venv
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-decoder-venv-${{ hashFiles('requirements.txt') }}

      - name: Install decoder dependencies
        if: steps.decoder-venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/decoder-venv"
          "$RUNNER_TEMP/decoder-venv/bin/python" -m pip install \
            --disable-pip-version-check -r requirements.txt

      - name: Materialize request
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$JOB_DIR"
          mkdir -p "$JOB_DIR/input" "$JOB_DIR/output"
          printf '%s\n' "starting" > "$JOB_DIR/status"

          fail_request() {
            printf '%s\n' "failed" > "$JOB_DIR/status"
            printf '%s\n' "$1" > "$JOB_DIR/error"
            exit 0
          }

          if [[ -z "$CHAT_ID" ]]; then
            fail_request "missing chat_id"
          fi
          if [[ -z "$FILENAME" || "$FILENAME" == *$'\n'* || "$FILENAME" == *$'\r'* ]]; then
            fail_request "missing or invalid filename"
          fi
          if [[ "$FILENAME" != "$(basename -- "$FILENAME")" || "$FILENAME" == "." || "$FILENAME" == ".." ]]; then
            fail_request "filename must not contain a directory path"
          fi
          source_count=0
          [[ -n "$FILE_DATA_B64" ]] && source_count=$((source_count + 1))
          [[ -n "$TELEGRAM_FILE_ID" ]] && source_count=$((source_count + 1))
          [[ -n "$DOWNLOAD_URL" ]] && source_count=$((source_count + 1))
          if (( source_count != 1 )); then
            fail_request "provide exactly one input source"
          fi

          input_path="$JOB_DIR/input/$FILENAME"
          if [[ -n "$FILE_DATA_B64" ]]; then
            if ! printf '%s' "$FILE_DATA_B64" | base64 --decode > "$input_path" 2>/dev/null; then
              fail_request "file_data_b64 is not valid Base64"
            fi
          elif [[ -n "$TELEGRAM_FILE_ID" ]]; then
            if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
              fail_request "Telegram download is not configured"
            fi
            telegram_payload="$(jq -cn --arg file_id "$TELEGRAM_FILE_ID" '{file_id:$file_id}')"
            file_info="$(curl --fail --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              -X POST --data "$telegram_payload" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile" 2>/dev/null || true)"
            if [[ "$(printf '%s' "$file_info" | jq -r '.ok // false' 2>/dev/null)" != "true" ]]; then
              fail_request "Telegram file lookup failed"
            fi
            if ! file_path="$(printf '%s' "$file_info" | jq -er '.result.file_path' 2>/dev/null)"; then
              fail_request "Telegram file path was not returned"
            fi
            if ! curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 --max-time 60 --max-filesize "$MAX_INPUT_BYTES" \
              "https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${file_path}" \
              --output "$input_path" 2>/dev/null; then
              fail_request "Telegram file download failed or exceeded the size limit"
            fi
          else
            if [[ "$DOWNLOAD_URL" != https://* ]]; then
              fail_request "download_url must use HTTPS"
            fi
            if ! curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 --max-time 60 --max-filesize "$MAX_INPUT_BYTES" \
              "$DOWNLOAD_URL" --output "$input_path" 2>/dev/null; then
              fail_request "temporary download failed or exceeded the size limit"
            fi
          fi

          size="$(wc -c < "$input_path")"
          if (( size == 0 )); then
            fail_request "input file is empty"
          fi
          if (( size > MAX_INPUT_BYTES )); then
            fail_request "input file exceeds the 10 MiB limit"
          fi
          if [[ -n "$DOWNLOAD_SHA256" ]]; then
            if [[ ! "$DOWNLOAD_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
              fail_request "download_sha256 is not a SHA-256 digest"
            fi
            actual="$(sha256sum "$input_path" | awk '{print tolower($1)}')"
            if [[ "$actual" != "${DOWNLOAD_SHA256,,}" ]]; then
              fail_request "downloaded file SHA-256 does not match"
            fi
          fi

          printf '%s\n' "ready" > "$JOB_DIR/status"
          printf '%s\n' "$input_path" > "$JOB_DIR/input_path"

      - name: Run matching decoder
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat "$JOB_DIR/status")" != "ready" ]]; then
            exit 0
          fi

          if "$RUNNER_TEMP/decoder-venv/bin/python" scripts/decoder_job.py \
            --root "$GITHUB_WORKSPACE" \
            --input "$(cat "$JOB_DIR/input_path")" \
            --output-dir "$JOB_DIR/output" \
            > "$JOB_DIR/decoder_stdout" 2> "$JOB_DIR/decoder_stderr"; then
            printf '%s\n' "success" > "$JOB_DIR/status"
          else
            printf '%s\n' "failed" > "$JOB_DIR/status"
            printf '%s\n' "decoder failed; check that the extension is supported and its script is present" > "$JOB_DIR/error"
          fi

      - name: Send result to Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          status="$(cat "$JOB_DIR/status" 2>/dev/null || printf '%s' 'failed')"

          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            printf '%s\n' "TELEGRAM_BOT_TOKEN is not configured" >&2
            exit 1
          fi

          if [[ "$status" == "success" && -s "$JOB_DIR/output/result.txt" ]]; then
            python scripts/result_message.py \
              --filename "$FILENAME" \
              --first-name "$REQUESTER_FIRST_NAME" \
              --last-name "$REQUESTER_LAST_NAME" \
              --username "$REQUESTER_USERNAME" \
              --user-id "$REQUESTER_USER_ID" \
              > "$JOB_DIR/result-caption.html"

            reply_markup='{"inline_keyboard":[[{"text":"📢 Channel 1 📢","url":"https://t.me/reversalxmods1"},{"text":"📢 Channel 2 📢","url":"https://t.me/reversalxmods2"}],[{"text":"👥 Group 👥","url":"https://t.me/reversemoda"}]]}'
            curl --fail --silent --show-error --max-time 60 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$JOB_DIR/output/result.txt;filename=${FILENAME}.txt" \
              -F "parse_mode=HTML" \
              --form-string "caption=$(cat "$JOB_DIR/result-caption.html")" \
              --form-string "reply_markup=$reply_markup"
          else
            failure_text=$'⚠️ <b>Unable to process this file</b>\n\nPlease make sure it is a supported configuration file and try again.'
            curl --fail --silent --show-error --max-time 30 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -F "chat_id=$CHAT_ID" \
              -F "parse_mode=HTML" \
              --form-string "text=$failure_text"
            exit 1
          fi

      - name: Remove temporary request data
        if: always()
        shell: bash
        run: rm -rf "$JOB_DIR"

  help:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'bot-help'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id || '' }}
      FIRST_NAME: ${{ github.event.client_payload.first_name || '' }}
      LAST_NAME: ${{ github.event.client_payload.last_name || '' }}
      USERNAME: ${{ github.event.client_payload.username || '' }}
      USER_ID: ${{ github.event.client_payload.user_id || '' }}
      COMMAND: ${{ github.event.client_payload.command || '/start' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Check out bot presentation
        uses: actions/checkout@v4

      - name: Render welcome caption
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CHAT_ID" ]]; then
            echo "missing chat_id" >&2
            exit 1
          fi
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "TELEGRAM_BOT_TOKEN is not configured" >&2
            exit 1
          fi
          python scripts/bot_message.py \
            --first-name "$FIRST_NAME" \
            --last-name "$LAST_NAME" \
            --username "$USERNAME" \
            --user-id "$USER_ID" \
            --command "$COMMAND" \
            > "$RUNNER_TEMP/welcome-caption.html"

      - name: Send welcome image and caption
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F "chat_id=$CHAT_ID" \
            -F "photo=@assets/reversalx-vpn-decode-logo.png" \
            -F "parse_mode=HTML" \
            --form-string "caption=$(cat "$RUNNER_TEMP/welcome-caption.html")"